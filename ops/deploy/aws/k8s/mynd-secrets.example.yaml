# Secret consumed by values-mynd.yaml. Generate a real key and apply BEFORE helm:
#
#   KEY=$(openssl rand 32 | base64 | tr '+/' '-_')
#   kubectl create secret generic mynd-secrets \
#     --namespace mynd \
#     --from-literal=MYND_LOCAL_ENCRYPTION_KEY="$KEY"
#
# (This file is just a template — prefer the kubectl command above so the key
# never lands in git. For prod, use AWS KMS via IRSA instead: set
# MYND_KMS_PROVIDER=aws + MYND_AWS_KMS_KEY_ID and drop this secret.)
apiVersion: v1
kind: Secret
metadata:
  name: mynd-secrets
  namespace: mynd
type: Opaque
stringData:
  # urlsafe base64 of 32 bytes (Fernet key) — REPLACE
  MYND_LOCAL_ENCRYPTION_KEY: "REPLACE_ME_openssl_rand_32_base64_urlsafe"
